<body><div class="app"><aside class="side"><div class="brand"><div class="brand-mark">数</div><span>业务数据中台</span></div><div class="menu-title">数据分析</div><div class="menu-item active"><div class="menu-icon">▦</div><span>圈子观点互动</span></div><div class="menu-item"><div class="menu-icon">◫</div><span>用户行为分析</span></div><div class="menu-item"><div class="menu-icon">⌁</div><span>内容运营分析</span></div><div class="menu-title">系统管理</div><div class="menu-item"><div class="menu-icon">⚙</div><span>报表权限</span></div><div class="side-footer">数据更新时间：2026-10-10 14:30</div></aside><main class="main"><header class="top"><div class="crumb">数据分析　/ <strong>圈子观点用户互动</strong></div><div class="account"><div class="avatar">张</div>张老师　⌄</div></header><section class="content"><div class="page-title"><div><h1>圈子观点用户互动数据统计报表</h1><p>查看圈子观点内容的用户互动明细与老师维度汇总数据</p></div><div class="rule-note">统计口径：同类行为按用户计 1 次，正反向互动仅记录最终选择</div></div><div class="tabs"><button class="tab active" data-report="detail">互动明细报表</button><button class="tab" data-report="summary">互动汇总报表</button></div><div class="card filters"><div class="filter-grid"><div class="field"><label>起止日期</label><div class="date-range"><input id="startDate" class="control" type="date" value="2026-09-01"><span>至</span><input id="endDate" class="control" type="date" value="2026-10-10"></div></div><div class="field"><label>圈子</label><select id="circle" class="control"><option value="all">全部圈子</option><option>职业投资训练营</option><option>进阶研习社</option><option>时空共振训练营</option></select></div><div class="field"><label>老师</label><div class="multi-wrap"><button class="multi-trigger" id="teacherTrigger"><span class="placeholder" id="teacherText">全部老师</span><span class="chevron">⌄</span></button><div class="multi-menu" id="teacherMenu"><div class="multi-action" id="selectAll">全选 / 取消全选</div><label class="check-row"><input type="checkbox" value="卢彬">卢彬老师</label><label class="check-row"><input type="checkbox" value="王思安">王思安老师</label><label class="check-row"><input type="checkbox" value="陈潇">陈潇老师</label><label class="check-row"><input type="checkbox" value="周宁">周宁老师</label></div></div></div><div class="field"><label>当前查询</label><div id="querySummary" style="height:34px;line-height:34px;color:#667085;font-size:12px">全部日期 · 全部圈子 · 全部老师</div></div></div><div class="filter-actions"><button class="btn" id="resetBtn">重置</button><button class="btn primary" id="queryBtn">查询</button><button class="btn export" id="exportBtn">⇩ 导出 Excel</button></div></div><div class="card table-card"><div class="table-head"><h2 id="tableTitle">互动明细数据</h2><span class="result-count" id="resultCount">共 0 条</span></div><div class="table-scroll"><table class="data-table" id="dataTable"><thead></thead><tbody></tbody></table><div class="empty" id="empty">暂无符合条件的数据</div></div><div class="pagination" id="pagination"></div></div></section></main></div><div class="toast" id="toast"></div>
<script>
const teachers=['卢彬','王思安','陈潇','周宁'];const circles=['职业投资训练营','进阶研习社','时空共振训练营'];const topics=['【攻守有道 盘前】外围市场情绪扰动，聚焦低位有异动的方向。','【逻辑为王--稳中求胜】重点观察电池方向梯队与承接情况。','【巅峰策略】保持初心，跟进节奏，关注市场结构性机会。','【盘面观察】短期波动加大，耐心等待确定性信号。'];
const detail=[];for(let i=0;i<54;i++){const day=String((i%10)+1).padStart(2,'0');const month=i%3===0?'09':'10';const t=teachers[i%teachers.length],c=circles[i%circles.length];detail.push({date:`2026-${month}-${day}`,teacher:t,circle:c,id:`VP${202609170001+i}`,content:topics[i%topics.length],like:[0,1,4,12,28][i%5],flower:[0,2,3,7,15][i%5],received:[0,6,11,22,36][i%5],dislike:[0,0,1,2,5][i%5]})}
const summary=teachers.flatMap((t,ti)=>{const rows=[];for(let d=1;d<=8;d++){const date=`2026-${d<10?'09':'10'}-${String(d+ti).padStart(2,'0')}`;rows.push({date,teacher:t,opinions:2+(d+ti)%4,like:3+(d*ti+2)%15,flower:(d+ti)%7,received:8+(d*3+ti)%22,dislike:(d+ti)%3})}return rows});
let report='detail',page=1,filtered=[];const pageSize=30;const $=id=>document.getElementById(id);const headers={detail:[['date','日期'],['teacher','老师'],['id','观点ID'],['content','观点内容'],['like','点赞数'],['flower','送花数'],['received','收到数'],['dislike','点踩数']],summary:[['date','日期'],['teacher','老师'],['opinions','观点总数'],['like','点赞总数'],['flower','送花总数'],['received','收到总数'],['dislike','点踩总数']]};
function selectedTeachers(){return [...document.querySelectorAll('#teacherMenu input:checked')].map(x=>x.value)}function formatNum(v){return v.toLocaleString('zh-CN')}function renderTable(){const th=headers[report].map(x=>`<th>${x[1]}</th>`).join('');$('dataTable').className='data-table '+(report==='summary'?'summary-table':'');$('dataTable').querySelector('thead').innerHTML='<tr>'+th+'</tr>';const start=(page-1)*pageSize,rows=filtered.slice(start,start+pageSize);$('dataTable').querySelector('tbody').innerHTML=rows.map(r=>`<tr>${headers[report].map(([k])=>{if(k==='content')return `<td class="content-cell" title="${r[k]}">${r[k]}</td>`;if(k==='id')return `<td class="id">${r[k]}</td>`;if(k==='teacher')return `<td class="teacher">${r[k]}老师</td>`;if(k==='date')return `<td class="date-cell">${r[k]}</td>`;if(['like','flower','received','dislike'].includes(k))return `<td class="num ${k}">${formatNum(r[k])}</td>`;return `<td class="num">${formatNum(r[k])}</td>`}).join('')}</tr>`).join('');$('empty').style.display=rows.length?'none':'flex';$('dataTable').style.display=rows.length?'table':'none';$('resultCount').textContent=`共 ${filtered.length} 条`;renderPagination()}
function renderPagination(){const pages=Math.max(1,Math.ceil(filtered.length/pageSize));if(page>pages)page=pages;let html=`<span class="page-info">第 ${page} / ${pages} 页</span><button class="page-btn" ${page===1?'disabled':''} data-page="${page-1}">‹</button>`;for(let i=1;i<=pages;i++){if(i===1||i===pages||Math.abs(i-page)<=1)html+=`<button class="page-btn ${i===page?'active':''}" data-page="${i}">${i}</button>`;else if(i===2&&page>4||i===pages-1&&page<pages-3)html+='<span style="color:#98a2b3">…</span>'}html+=`<button class="page-btn" ${page===pages?'disabled':''} data-page="${page+1}">›</button>`;$('pagination').innerHTML=html}
function applyQuery(){const start=$('startDate').value,end=$('endDate').value,circle=$('circle').value,ts=selectedTeachers();const source=report==='detail'?detail:summary;filtered=source.filter(r=>(!start||r.date>=start)&&(!end||r.date<=end)&&(circle==='all'||r.circle===circle)&&(ts.length===0||ts.includes(r.teacher)));page=1;$('querySummary').textContent=`${start||'不限'} 至 ${end||'不限'} · ${circle==='all'?'全部圈子':circle} · ${ts.length?ts.map(t=>t+'老师').join('、'):'全部老师'}`;renderTable();showToast('查询完成')}
function reset(){ $('startDate').value='2026-09-01';$('endDate').value='2026-10-10';$('circle').value='all';document.querySelectorAll('#teacherMenu input').forEach(x=>x.checked=false);$('teacherText').textContent='全部老师';applyQuery()}
function updateTeacherText(){const ts=selectedTeachers();$('teacherText').textContent=ts.length?(ts.length===teachers.length?'全部老师':ts.map(t=>t+'老师').join('、')):'全部老师'}
function exportExcel(){const rows=filtered.length?filtered:(report==='detail'?detail:summary);const cols=headers[report];const csv='\ufeff'+[cols.map(x=>x[1]).join(','),...rows.map(r=>cols.map(([k])=>`"${String(k==='teacher'?r[k]+'老师':r[k]).replaceAll('"','""')}"`).join(','))].join('\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`圈子观点用户互动${report==='detail'?'明细':'汇总'}报表.csv`;a.click();URL.revokeObjectURL(a.href);showToast('已导出当前查询结果')}
function showToast(t){const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(window._tt);window._tt=setTimeout(()=>e.classList.remove('show'),1800)}
const tabWrap=document.querySelector('.tabs'),sideMenu=document.querySelector('.menu-title');const reportNav=document.createElement('div');reportNav.className='report-nav';const reportIcons={detail:'▦',summary:'▤'};tabWrap.querySelectorAll('.tab').forEach(b=>{b.className='menu-item menu-report '+(b.classList.contains('active')?'active':'');b.innerHTML='<div class="menu-icon">'+reportIcons[b.dataset.report]+'</div><span>'+b.textContent+'</span>';reportNav.appendChild(b)});sideMenu.insertAdjacentElement('afterend',reportNav);tabWrap.remove();document.head.insertAdjacentHTML('beforeend','<style>.report-nav{margin-top:2px}.menu-report{font-size:13px}.menu-report.active{background:var(--nav2);color:#fff}.menu-report.active:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:#4d8cff}</style>');document.querySelectorAll('.menu-report').forEach(b=>b.onclick=()=>{document.querySelectorAll('.menu-report').forEach(x=>x.classList.remove('active'));b.classList.add('active');report=b.dataset.report;$('tableTitle').textContent=report==='detail'?'互动明细数据':'互动汇总数据';applyQuery()});$('queryBtn').onclick=applyQuery;$('resetBtn').onclick=reset;$('exportBtn').onclick=exportExcel;$('pagination').onclick=e=>{const b=e.target.closest('[data-page]');if(b&&!b.disabled){page=Number(b.dataset.page);renderTable()}};$('teacherTrigger').onclick=()=> $('teacherMenu').classList.toggle('open');document.addEventListener('click',e=>{if(!e.target.closest('.multi-wrap'))$('teacherMenu').classList.remove('open')});$('selectAll').onclick=()=>{const boxes=[...document.querySelectorAll('#teacherMenu input')],all=boxes.every(x=>x.checked);boxes.forEach(x=>x.checked=!all);updateTeacherText()};document.querySelectorAll('#teacherMenu input').forEach(x=>x.onchange=updateTeacherText);applyQuery();
</script><script>
document.querySelector('.page-title p')?.remove();
document.querySelector('.rule-note')?.remove();
const querySummaryField=document.querySelector('#querySummary')?.closest('.field');
if(querySummaryField)querySummaryField.style.display='none';
const circleControl=document.getElementById('circle');
if(circleControl){circleControl.multiple=false;circleControl.title='圈子仅支持单选';}
 document.head.insertAdjacentHTML('beforeend','<style>.content-cell{max-width:250px!important}.filter-grid{grid-template-columns:235px 235px minmax(300px,1fr)!important}</style>');
const originalRenderTable=renderTable;
renderTable=function(){originalRenderTable();document.querySelectorAll('.content-cell').forEach(cell=>{const full=cell.textContent;cell.title=full;if(full.length>18)cell.textContent=full.slice(0,18)+'…';});};
renderTable();
document.querySelector('.brand')?.remove();
document.querySelectorAll('.menu-title,.menu-item:not(.menu-report),.side-footer').forEach(node=>node.remove());
document.head.insertAdjacentHTML('beforeend','<style>.side{padding-top:18px}.report-nav{margin-top:0}</style>');
const allCircleOption=document.querySelector('#circle option[value="all"]');
if(allCircleOption)allCircleOption.remove();
const firstCircle=circles[0];
if(circleControl){circleControl.value=firstCircle;applyQuery();}
const originalReset=reset;
reset=function(){originalReset();if(circleControl){circleControl.value=firstCircle;applyQuery();}};
const periodTotals=teachers.map(teacher=>{const rows=summary.filter(r=>r.teacher===teacher);return {date:'期间汇总',teacher,opinions:rows.reduce((n,r)=>n+r.opinions,0),like:rows.reduce((n,r)=>n+r.like,0),flower:rows.reduce((n,r)=>n+r.flower,0),received:rows.reduce((n,r)=>n+r.received,0),dislike:rows.reduce((n,r)=>n+r.dislike,0)};});
summary.push(...periodTotals);
const originalApplyQuery=applyQuery;
applyQuery=function(){const start=$('startDate').value,end=$('endDate').value,circle=$('circle').value,ts=selectedTeachers();const source=report==='detail'?detail:summary;filtered=source.filter(r=>r.date==='期间汇总'||((!start||r.date>=start)&&(!end||r.date<=end)&&(circle==='all'||r.circle===circle)&&(ts.length===0||ts.includes(r.teacher))));page=1;$('querySummary').textContent=`${start||'不限'} 至 ${end||'不限'} · ${circle==='all'?'全部圈子':circle} · ${ts.length?ts.map(t=>t+'老师').join('、'):'全部老师'}`;renderTable();showToast('查询完成')};
const previousRenderTable=renderTable;
renderTable=function(){previousRenderTable();document.querySelectorAll('#dataTable tbody tr').forEach(row=>{if(row.firstElementChild?.textContent==='期间汇总')row.classList.add('summary-total');});};
const applyQueryWithTotals=applyQuery;
applyQuery=function(){applyQueryWithTotals();if(report==='summary'){const ts=selectedTeachers();filtered=filtered.filter(r=>r.date!=='期间汇总'||ts.length===0||ts.includes(r.teacher));renderTable();}};
if(circleControl){const placeholder=document.createElement('option');placeholder.value='';placeholder.textContent='请选择圈子';circleControl.insertBefore(placeholder,circleControl.firstChild);circleControl.value='';}
applyQuery=function(){const start=$('startDate').value,end=$('endDate').value,circle=$('circle').value,ts=selectedTeachers();const source=report==='detail'?detail:summary;filtered=source.filter(r=>(r.date==='期间汇总'?(ts.length===0||ts.includes(r.teacher)) : ((!start||r.date>=start)&&(!end||r.date<=end)&&(!circle||r.circle===circle)&&(ts.length===0||ts.includes(r.teacher)))));page=1;$('querySummary').textContent=`${start||'不限'} 至 ${end||'不限'} · ${circle||'未选择圈子'} · ${ts.length?ts.map(t=>t+'老师').join('、'):'全部老师'}`;renderTable();showToast('查询完成')};
reset=function(){originalReset();if(circleControl){circleControl.value='';applyQuery();}};
const originalUpdateTeacherText=updateTeacherText;
updateTeacherText=function(){const ts=selectedTeachers();$('teacherText').textContent=ts.length?(ts.length===teachers.length?'全部老师':ts.map(t=>t+'老师').join('、')):'请选择老师';};
if($('teacherText'))$('teacherText').textContent='请选择老师';
const resetWithEmptyTeacher=reset;
reset=function(){resetWithEmptyTeacher();document.querySelectorAll('#teacherMenu input').forEach(x=>x.checked=false);updateTeacherText();applyQuery();};
const buildPeriodTotals=()=>teachers.map(teacher=>{const rows=summary.filter(r=>r.teacher===teacher&&r.date!=='期间汇总');return {date:'期间汇总',teacher,opinions:rows.reduce((n,r)=>n+r.opinions,0),like:rows.reduce((n,r)=>n+r.like,0),flower:rows.reduce((n,r)=>n+r.flower,0),received:rows.reduce((n,r)=>n+r.received,0),dislike:rows.reduce((n,r)=>n+r.dislike,0)};});
summary.splice(summary.findIndex(r=>r.date==='期间汇总'),summary.filter(r=>r.date==='期间汇总').length,...buildPeriodTotals());
summary.sort((a,b)=>a.date==='期间汇总'?-1:b.date==='期间汇总'?1:0);
const renderWithPeriodLabel=renderTable;
renderTable=function(){renderWithPeriodLabel();document.querySelectorAll('#dataTable tbody tr').forEach(row=>{if(row.firstElementChild?.textContent==='期间汇总')row.firstElementChild.textContent='具体区间日期';});};
document.head.insertAdjacentHTML('beforeend','<style>.field:has(#teacherTrigger){max-width:260px}.multi-wrap,.multi-menu{max-width:260px}.multi-trigger .placeholder{max-width:205px}.multi-menu{right:auto;width:260px}</style>');
const renderWithRangeLabel=renderTable;
renderTable=function(){renderWithRangeLabel();const formatDate=v=>v?v.replaceAll('-','/'):'未选择';const range=`${formatDate($('startDate').value)}-${formatDate($('endDate').value)}`;document.querySelectorAll('#dataTable tbody tr').forEach(row=>{if(row.firstElementChild?.textContent==='具体区间日期')row.firstElementChild.textContent=range;});};
document.head.insertAdjacentHTML('beforeend','<style>.date-range input{width:132px}.filter-grid{grid-template-columns:300px 235px minmax(260px,1fr)!important}</style>');
applyQuery();
detail.sort((a,b)=>b.date.localeCompare(a.date));
summary.sort((a,b)=>a.date==='期间汇总'?-1:b.date==='期间汇总'?1:b.date.localeCompare(a.date));
applyQuery();
</script></body></html>
